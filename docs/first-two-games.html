<template id="tpl">
<div class="page">

<header>
  <div class="kicker">jump-ahead · mini-juegos</div>
  <h1 data-edit="title">Los dos primeros juegos</h1>
  <p class="lead" data-edit="lead">Qué recibe la IA, qué tiene que encontrar, cómo armamos cada juego y cómo la calificamos. Con dos juegos que podés tocar.</p>
  <div class="status" data-edit="status"><b>Los dos juegos están armados y verificados con cuentas.</b> Todavía ninguna IA los jugó.</div>
  <div class="bar" id="editbar" hidden>
    <button type="button" id="edit-start">Editar texto</button>
    <button type="button" id="edit-save" hidden>Guardar cambios</button>
    <button type="button" class="quiet" id="edit-cancel" hidden>Cancelar</button>
    <span id="edit-note" role="status"></span>
  </div>
</header>

<section>
  <div class="sechead"><h2 data-edit="a-h">Las tres piezas de un juego</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="a-1">Todos los juegos tienen la misma forma. Son tres piezas.</p>
  <div class="pieces">
    <div class="piece"><b data-edit="a-p1h">1. Una regla de generación</b><span data-edit="a-p1">Dice cómo cambia una fila de casillas de un paso al siguiente. Es corta, y la IA la ve entera.</span></div>
    <div class="piece"><b data-edit="a-p2h">2. Una pregunta lejana</b><span data-edit="a-p2">Por ejemplo: ¿cómo va a estar la casilla 1 en el paso un trillón? Calculando paso por paso no se llega.</span></div>
    <div class="piece"><b data-edit="a-p3h">3. Una regla de resultado</b><span data-edit="a-p3">Dice qué pasa lejos sin recorrer los pasos del medio. No se la damos: es lo que la IA tiene que encontrar.</span></div>
  </div>
  <p data-edit="a-2">Nosotros sí conocemos la regla de resultado. Con ella calculamos la respuesta exacta, y con eso calificamos.</p>
  <p data-edit="a-3">¿Y cómo la conocemos, si al paso un trillón tampoco llegamos contando? Porque el juego se arma al revés: <b>primero elegimos la regla de resultado</b>, y después escribimos el juego a partir de ella. El paso a paso está más abajo, después del juego 1.</p>
  <p class="more"><a href="#build" id="to-build">Ir a «Cómo se arma un juego» ↓</a></p>
</section>

<section>
  <div class="sechead"><h2 data-edit="b-h">Juego 1: la luz que da vueltas</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="b-1">Hay 7 casillas en ronda: la última es vecina de la primera. Una sola está prendida.</p>
  <p data-edit="b-2">La <b>regla de generación</b> es una línea: cada casilla copia a su vecina de la izquierda. Eso hace que la luz se corra un lugar por paso.</p>
  <figure>
    <div class="rows" id="g1-rows" aria-live="polite"></div>
    <div class="ctrl">
      <button type="button" id="g1-step">Un paso</button>
      <button type="button" class="quiet" id="g1-reset">Volver a empezar</button>
    </div>
    <figcaption data-edit="b-cap">Apretá «Un paso» varias veces y mirá qué pasa al llegar al paso 7.</figcaption>
  </figure>
  <p data-edit="b-3">En el paso 7 la fila vuelve a estar igual que al principio, y desde ahí se repite todo. Esa es la <b>regla de resultado</b> de este juego: todo se repite cada 7 pasos, así que solo importa lo que sobra al dividir el paso por 7.</p>
  <figure>
    <div class="ctrl">
      <label for="g1-far">Probala con un paso lejano:</label>
      <input type="text" id="g1-far" inputmode="numeric" value="1000000000000000000" aria-describedby="g1-out">
      <button type="button" id="g1-jump">Saltar</button>
    </div>
    <div class="out" id="g1-out" aria-live="polite"></div>
    <div class="rows" id="g1-far-row"></div>
  </figure>
  <p data-edit="b-4">Este juego es fácil a propósito. Sirve para ver las piezas, y de control: si una IA falla acá, lo que está roto es nuestro programa, no la IA.</p>
  <details>
    <summary>Ver el texto exacto que recibe la IA</summary>
<pre>Sistema: una fila de 7 casillas en anillo (la última es vecina de la primera).
Las casillas se numeran desde 0. Cada una está prendida (1) o apagada (0).

Regla (se aplica a todas las casillas a la vez, una vez por paso):
  cada casilla pasa a valer lo que valía su vecina de la izquierda.

Paso 0:
  1000000

Preguntas. Para cada una, contestá con la probabilidad de que la casilla esté prendida:
  - casilla 0 en el paso 1000000000000000000
  - casilla 1 en el paso 1000000000000000000
  ... (y así hasta la casilla 6)</pre>
  </details>
</section>

<section id="build">
  <div class="sechead"><h2 data-edit="g-h">Cómo se arma un juego</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="g-1">Para calificar necesitamos la respuesta exacta del paso un trillón. Y nosotros tampoco llegamos hasta ahí contando paso por paso. ¿De dónde la sacamos?</p>
  <p data-edit="g-2">De que armamos el juego al revés. No escribimos un juego para después buscarle la regla de resultado. <b>Empezamos por la regla de resultado</b>, y el juego se escribe a partir de ella.</p>
  <p data-edit="g-3">Es lo que hace quien arma un crucigrama: primero elige las palabras y después escribe las pistas. Por eso conoce las respuestas.</p>
  <figure class="orders" role="group" aria-label="El orden en que la IA recibe las piezas y el orden en que nosotros las armamos">
    <div class="order"><span class="who">La IA, al jugar</span>
      <span class="chip">regla de generación</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">pregunta lejana</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip ghost">¿regla de resultado?</span></div>
    <div class="order"><span class="who">Nosotros, al armar</span>
      <span class="chip first">regla de resultado</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">regla de generación</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">pregunta lejana</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">verificación</span></div>
    <figcaption data-edit="g-capo">Son las mismas piezas en otro orden. La IA tiene que llegar a donde nosotros empezamos.</figcaption>
  </figure>

  <h3 data-edit="g-h2">Los cuatro pasos, con el juego 1</h3>
  <ol class="steps">
    <li><span class="t" data-edit="g-s1h">Elegimos una regla de resultado</span>
      <span class="what" data-edit="g-s1">Tiene que ser algo ya demostrado: probado con un razonamiento, no solo visto en ejemplos.</span>
      <span class="here" data-edit="g-s1x"><b>En el juego 1:</b> lo que da vueltas en una ronda de 7 lugares vuelve al mismo lugar cada 7 pasos.</span></li>
    <li><span class="t" data-edit="g-s2h">Escribimos la regla de generación que la produce</span>
      <span class="what" data-edit="g-s2">Una línea que diga solo cómo se pasa de un paso al siguiente. Es lo que va a ver la IA.</span>
      <span class="here" data-edit="g-s2x"><b>En el juego 1:</b> cada casilla copia a su vecina de la izquierda. Eso hace que la luz dé vueltas.</span></li>
    <li><span class="t" data-edit="g-s3h">Elegimos el comienzo y la pregunta lejana</span>
      <span class="what" data-edit="g-s3">La pregunta tiene que quedar tan lejos que contando paso por paso no se llegue.</span>
      <span class="here" data-edit="g-s3x"><b>En el juego 1:</b> una sola casilla prendida, y el paso un trillón.</span></li>
    <li><span class="t" data-edit="g-s4h">Verificamos con cuentas, sin ninguna IA</span>
      <span class="what" data-edit="g-s4">Hacemos la cuenta paso por paso hasta donde se llega. En cada paso la comparamos con lo que dice la regla de resultado, casilla por casilla. Si difieren una sola vez, el juego se tira.</span>
      <span class="here" data-edit="g-s4x"><b>En el juego 1:</b> los pasos 0 a 3.000, sin ninguna diferencia.</span></li>
  </ol>
  <figure>
    <div class="ctrl">
      <button type="button" id="v1-ok">Verificar el juego 1</button>
      <button type="button" class="quiet" id="v1-bad">Probar una regla equivocada</button>
    </div>
    <div class="out" id="v1-out" aria-live="polite"></div>
    <div class="rows" id="v1-rows"></div>
    <figcaption data-edit="g-cap">Con el primer botón, la página hace esa comparación ahora mismo. El segundo usa a propósito una regla de resultado equivocada, para ver cómo se nota el error.</figcaption>
  </figure>

  <h3 data-edit="g-h3">¿Y cómo sabemos que vale en el paso un trillón?</h3>
  <p data-edit="g-4">Comparamos hasta el paso 3.000, y la pregunta es por el paso un trillón. La comparación sola no asegura que la regla siga valiendo tan lejos.</p>
  <p data-edit="g-5">Lo asegura un razonamiento. En el juego 1 es corto: en una ronda de 7, correrse 7 lugares es volver a donde uno estaba. Eso es cierto en el paso 7 y en el paso un trillón.</p>
  <p data-edit="g-6">La comparación sirve para otra cosa: para pescar errores nuestros al escribir el programa. Son dos seguros distintos. El razonamiento dice que la regla es cierta. La comparación dice que la escribimos bien.</p>

  <h3 data-edit="g-h4">De dónde salen las reglas de resultado</h3>
  <p data-edit="g-7">No las inventamos. Las tomamos de matemática que ya está demostrada. El juego 1 usa la más simple que hay: lo que da vueltas, vuelve. El juego 2 usa otra, que está más abajo.</p>
  <ul>
    <li data-edit="g-8">Eso tiene un costo. Si la regla ya está en los libros, una IA puede saberla de memoria. De eso se ocupan los juegos que siguen, que la disfrazan.</li>
    <li data-edit="g-9">Hay dos tipos de juego que no se arman así: los que no tienen ninguna regla de resultado, y las trampas. Los vemos cuando lleguen.</li>
    <li data-edit="g-10">La IA no tiene que encontrar la misma regla de resultado que elegimos nosotros. Si encuentra otra que da las respuestas correctas, saca el mismo puntaje: solo calificamos las respuestas.</li>
  </ul>
</section>

<section>
  <div class="sechead"><h2 data-edit="c-h">Cómo se califica</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="c-1">La IA no contesta solo sí o no. Dice cuán segura está de que la casilla está prendida. Eso permite tratar distinto al que sabe, al que duda y al que inventa.</p>
  <figure>
    <div class="ctrl">
      <label for="score-p">En el juego 1, la casilla 1 está prendida. La IA dice estar segura en un:</label>
      <input type="range" id="score-p" min="0" max="100" step="1" value="100">
    </div>
    <div class="out" id="score-out" aria-live="polite"></div>
    <div class="scale" aria-hidden="true">
      <div class="track"></div>
      <div class="mark" id="score-mark"></div>
      <span class="tick" style="left:0%">−3</span><span class="tick" style="left:25%">−2</span><span class="tick" style="left:50%">−1</span><span class="tick" style="left:75%">0</span><span class="tick" style="left:100%">+1</span>
    </div>
  </figure>
  <p data-edit="c-2">Mové la barra y fijate en tres puntos. Con 100% y acertando, saca +1. Con 50%, que es decir «no sé», saca 0. Con 0%, o sea segura de lo contrario, saca −3. Equivocarse con seguridad cuesta mucho más que admitir que no se sabe.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="d-h">Juego 2: las vecinas distintas</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="d-1">Ahora hay 101 casillas en ronda, y varias prendidas al empezar.</p>
  <p data-edit="d-2">La <b>regla de generación</b> también es una línea: una casilla queda prendida si sus dos vecinas eran distintas entre sí. Si eran iguales, queda apagada.</p>
  <div class="cases" aria-label="Tres ejemplos de la regla">
    <span class="case"><span class="sq on"></span><span class="sq">?</span><span class="sq"></span> → <span class="sq on"></span> distintas: prendida</span>
    <span class="case"><span class="sq on"></span><span class="sq">?</span><span class="sq on"></span> → <span class="sq"></span> iguales: apagada</span>
    <span class="case"><span class="sq"></span><span class="sq">?</span><span class="sq"></span> → <span class="sq"></span> iguales: apagada</span>
  </div>
  <figure>
    <canvas id="g2-canvas" width="606" height="360" role="img" aria-label="Los primeros pasos del juego 2: un dibujo de triángulos desordenados, sin repetición a la vista"></canvas>
    <div class="ctrl">
      <button type="button" id="g2-step">Un paso</button>
      <button type="button" id="g2-run">40 pasos más</button>

  <p data-edit="d-3">A diferencia del juego 1, acá esperar a que el dibujo se repita no sirve. Lo dejamos correr 200.000 pasos y la fila no se repitió. Se repite, pero recién a los 375 billones de pasos.</p>

  <h3 data-edit="d-h2">La regla de resultado, escondida a simple vista</h3>
  <p data-edit="d-4">Sin embargo hay un orden. Después de 2 pasos, cada casilla depende solo de las dos casillas que están a distancia 2. Después de 4 pasos, de las que están a distancia 4. Después de 8, a distancia 8. Y así con 16, 32, 64...</p>
  <p data-edit="d-5">O sea: dar 8 pasos de a uno da lo mismo que aplicar la regla una sola vez, mirando 8 casillas más lejos. Comprobalo:</p>

  <p data-edit="d-6">Con 3 no funciona: solo vale para 1, 2, 4, 8, 16 y los que siguen duplicando. Pero alcanza, porque cualquier número se arma sumando de esos. Para llegar al paso un trillón hacen falta 24 saltos, en vez de un trillón de pasos.</p>

  <h3 data-edit="d-h4">Por qué esa regla vale siempre</h3>
  <p data-edit="d-9">Igual que en el juego 1, la comparación llega hasta el paso 3.000. Que la regla valga también en el paso un trillón lo asegura un razonamiento. Este se puede tocar.</p>

  <p data-edit="d-10">Las dos de las puntas cambian la casilla de abajo. Las otras tres no la cambian nunca.</p>
  <p data-edit="d-11">La del medio no cuenta porque, al cambiarla, cambian a la vez las dos casillas del paso 1 que la miran. Y si las dos cambian juntas, siguen siendo iguales o distintas entre sí, igual que antes.</p>
  <p data-edit="d-13">Las dos que están pegadas al medio tampoco cuentan. Solo cambian la casilla central del paso 1, y la de abajo no la mira: cada casilla mira a sus dos vecinas, no a la que tiene justo arriba.</p>
  <p data-edit="d-12">O sea: 2 pasos dan lo mismo que aplicar la regla una vez a distancia 2. Esa regla tiene la misma forma que la original, así que el mismo razonamiento la lleva de 2 a 4, de 4 a 8, y así sin límite. Por eso vale en el paso un trillón, aunque nadie haya llegado hasta ahí contando.</p>

  function v2Run() {
    var t0 = performance.now();
    var res = verify(g2Start(), g2Step, function (s, t) { return g2Jump(s, t).row; }, V_UNTIL);
    var ms = performance.now() - t0;
    v2Last = res;
    $("v2-out").innerHTML = res.diffAt < 0
      ? "Comparamos <b>" + withDots(res.compared) + "</b> pasos (del 0 al " + withDots(V_UNTIL) +
        "), las 101 casillas de cada uno: <b>ninguna diferencia</b>. Tardó " + took(ms) + "."
      : "La cuenta y la regla <b>difieren en el paso " + withDots(res.diffAt) + "</b>. Un juego así se tira.";
    $("v2-a-lbl").textContent = "El paso " + withDots(res.shown) + ", contando de a un paso:";
    $("v2-b-lbl").textContent = "El paso " + withDots(res.shown) + ", con la regla de resultado:";
    $("v2-strips").hidden = false;
    v2Draw();
  }
  $("v2-ok").addEventListener("click", v2Run);

  // ---------- por qué vale la regla del juego 2: cinco casillas, dos pasos ----------
  var PYR_NAMES = ["La casilla de la punta izquierda", "La casilla pegada al medio, a la izquierda", "La casilla del medio",
    "La casilla pegada al medio, a la derecha", "La casilla de la punta derecha"];
  var pyr = { top: [1, 0, 1, 1, 0], cells: [], mid: [], bottom: null };
  function pyrBuild() {
    var box = $("pyr");
    function row(label) {
      var r = document.createElement("div"), l = document.createElement("span");
      r.className = "row"; l.className = "lbl"; l.textContent = label;
      r.appendChild(l); box.appendChild(r);
      return r;
    }
    function cell(parent, tag, cls) { var e = document.createElement(tag); e.className = cls; parent.appendChild(e); return e; }
    function gap(parent) { cell(parent, "span", "sq gap").setAttribute("aria-hidden", "true"); }
    var r0 = row("paso 0"), r1 = row("paso 1"), r2 = row("paso 2");
    [0, 1, 2, 3, 4].forEach(function (i) {
      var b = cell(r0, "button", "sq");
      b.type = "button";
      b.addEventListener("click", function () { pyr.top[i] ^= 1; pyrRender(); });
      pyr.cells.push(b);
    });
    gap(r1); for (var j = 0; j < 3; j++) pyr.mid.push(cell(r1, "span", "sq")); gap(r1);
    gap(r2); gap(r2); pyr.bottom = cell(r2, "span", "sq"); gap(r2); gap(r2);
  }
  function pyrRender() {
    var res = pyramid(pyr.top), differ = pyr.top[0] !== pyr.top[4];
    pyr.cells.forEach(function (b, i) {
      b.className = "sq" + (pyr.top[i] ? " on" : "");
      b.setAttribute("aria-pressed", String(!!pyr.top[i]));
      b.setAttribute("aria-label", PYR_NAMES[i] + ": " + (pyr.top[i] ? "prendida" : "apagada"));
    });
    pyr.mid.forEach(function (e, j) { e.className = "sq" + (res.mid[j] ? " on" : ""); });
    pyr.bottom.className = "sq" + (res.bottom ? " on" : "");
    $("pyr-out").innerHTML = "Las dos de las puntas son <b>" + (differ ? "distintas" : "iguales") +
      "</b>: la de abajo queda <b>" + (res.bottom ? "prendida" : "apagada") + "</b>.";
  }

  // ---------- el enlace del principio lleva a la sección de armado ----------
  $("to-build").addEventListener("click", function (e) {
    var target = $("build");
    if (!target || !target.scrollIntoView) return;
    e.preventDefault();
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  });

  function redrawCanvases() { g2Draw(); g2Compare(); g2DoJump(); if (v2Last) v2Draw(); }
  g1Reset(2); g1DoJump(); scoreRender(); g2Reset(G2_ROWS - 1); g2Compare(); g2DoJump();
  $("v1-out").textContent = "Todavía no se hizo. Apretá un botón.";
  $("v2-out").textContent = "Todavía no se hizo. Apretá el botón.";
  pyrBuild(); pyrRender();
  $("pyr-all").innerHTML = "La página probó las 32 maneras posibles de prender y apagar esas cinco casillas. En <b>" +
    pyramidHolds() + "</b> de las 32, la de abajo queda prendida cuando las dos puntas son distintas, y apagada cuando son iguales.";
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", redrawCanvases);
  }
  new MutationObserver(redrawCanvases).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- editar el texto y guardarlo como versión nueva de la página ----------
  var SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  var HEAD = '<title>Los dos primeros juegos</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">\n';
  function buildDocument(next) {
    var close = function (tag) { return "<" + "/" + tag + ">"; };
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    return SKELETON + "\n" + HEAD +
      '<style id="css">' + $("css").textContent + close("style") + "\n" +
      '<script type="application/json" id="state">' + json + close("script") + "\n" +
      '<template id="tpl">' + $("tpl").innerHTML + close("template") + "\n" +
      '<div id="app">' + close("div") + "\n" +
      '<script id="code">' + $("code").textContent + close("script") + "\n" +
      "\n</body></html>";
  }

  var editing = false, artifactApi = null;
  function note(msg) { $("edit-note").textContent = msg; }
  function setEditing(on) {
    editing = on;
    editable.forEach(function (el) { if (on) el.setAttribute("contenteditable", "true"); else el.removeAttribute("contenteditable"); });
    $("edit-start").hidden = on; $("edit-save").hidden = !on; $("edit-cancel").hidden = !on;
    note(on ? "Tocá cualquier texto resaltado y escribí." : "");
  }
  function readOnly() { setEditing(false); applyEdits(); $("editbar").hidden = true; }
  app.addEventListener("keydown", function (e) {
    if (editing && e.key === "Enter" && e.target.closest && e.target.closest("[data-edit]")) e.preventDefault();
  });
  app.addEventListener("paste", function (e) {
    if (!editing || !(e.target.closest && e.target.closest("[data-edit]"))) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    sel.deleteFromDocument();
    sel.getRangeAt(0).insertNode(document.createTextNode(text));
    sel.collapseToEnd();
  });
  $("edit-start").addEventListener("click", function () { setEditing(true); });
  $("edit-cancel").addEventListener("click", function () { setEditing(false); applyEdits(); });
  $("edit-save").addEventListener("click", function () {
    if (!artifactApi) return;
    var edits = {};
    editable.forEach(function (el) {
      var k = el.getAttribute("data-edit"), cur = sanitize(el.innerHTML);
      if (cur !== defaults[k]) edits[k] = cur;
    });
    note("Guardando…");
    $("edit-save").disabled = true;
    artifactApi.publish(buildDocument({ edits: edits })).then(function () {
      note("Guardado. La página se va a recargar.");
    }, function (err) {
      var code = err && err.code;
      $("edit-save").disabled = false;
      if (code === "conflict") { note("Se guardó otra versión antes. La página se va a recargar."); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" ||
          code === "capability_disabled" || code === "capability_removed") { readOnly(); return; }
      note("No se pudo guardar (" + (code || "error") + "). Tu texto sigue acá: probá de nuevo en un rato.");
    });
  });

  // ---------- las capacidades llegan después; la página funciona sin ellas ----------
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (api) {
      if (!api) return;
      artifactApi = api;
      $("editbar").hidden = false;
    }, function () {});
    window.claude.use("comments").then(function (api) {
      if (!api) return;
      Array.prototype.slice.call(app.querySelectorAll("button.ask")).forEach(function (btn) {
        btn.hidden = false;
        btn.addEventListener("click", function () {
          var section = btn.closest("section");
          api.openComposer({ element: section.querySelector("h2") || section }).then(function () {}, function (err) {
            if (err && err.code === "unavailable") btn.hidden = true;
          });
        });
      });
    }, function () {});
  }
})();
</script>
