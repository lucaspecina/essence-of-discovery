  <h1 data-edit="title">Cómo se arma un juego</h1>
  <p class="lead" data-edit="lead">Primero, la lógica de cómo construimos un juego, de a un paso por vez. Después, los dos juegos que ya están armados.</p>
  <div class="status" data-edit="status"><b>Los dos juegos están armados y verificados con cuentas.</b> Todavía ninguna IA los jugó.</div>
  <div class="bar" id="editbar" hidden>

    <button type="button" id="edit-save" hidden>Guardar cambios</button>
    <button type="button" class="quiet" id="edit-cancel" hidden>Cancelar</button>
    <span id="edit-note" role="status"></span>
  </div>
</header>

<section>
  <div class="kicker">Primera parte · la lógica</div>
  <div class="sechead"><h2 data-edit="p1-h">1. Qué queremos tener</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p1-1">Queremos tomarle un examen a una IA. Para eso necesitamos preguntas que cumplan dos cosas.</p>
  <ul>
    <li data-edit="p1-2"><b>Que nosotros sepamos la respuesta.</b> Si no, no podemos corregir.</li>
    <li data-edit="p1-3"><b>Que no se puedan contestar a pura fuerza.</b> Si alcanza con hacer cuentas largas, no medimos nada: cualquier computadora hace cuentas largas.</li>
  </ul>
  <p data-edit="p1-4">Todo lo que sigue es cómo conseguir preguntas así.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="p2-h">2. Un mundo chiquito con una regla</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p2-1">Empecemos por lo más simple que hay. Una fila de 7 casillas. Cada casilla está prendida o apagada. Están en ronda: la última es vecina de la primera.</p>
  <p data-edit="p2-2">Y una regla que dice cómo cambia la fila de un momento al siguiente. A cada cambio lo llamamos <b>un paso</b>. La regla es esta: <b>cada casilla copia a su vecina de la izquierda.</b></p>
  <figure>
    <div class="rows" id="g1-rows" aria-live="polite"></div>
    <div class="ctrl">
      <button type="button" id="g1-step">Un paso</button>
      <button type="button" class="quiet" id="g1-reset">Volver a empezar</button>
    </div>
    <figcaption data-edit="p2-cap">Apretá «Un paso» varias veces. Cada fila nueva sale de aplicarle la regla a la fila anterior.</figcaption>
  </figure>
  <p data-edit="p2-3">A esa regla la llamamos <b>regla de generación</b>, porque genera cada fila a partir de la anterior. Fijate que solo habla del paso siguiente. No dice nada de lo que pasa lejos.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="p3-h">3. Una pregunta lejana</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p3-1">Ahora la pregunta: <b>¿dónde va a estar la luz en el paso un trillón?</b> Un trillón es un 1 con 18 ceros.</p>
  <p data-edit="p3-2">La forma directa es apretar «Un paso» un trillón de veces. Una computadora que haga mil millones de pasos por segundo tardaría unos 31 años. A pura fuerza no se llega.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="p4-h">4. Pero se puede contestar pensando</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p4-1">Mirá de nuevo el dibujo de arriba. La regla hace que la luz se corra un lugar por paso. Hay 7 lugares en ronda. Entonces a los 7 pasos la luz dio la vuelta entera y está donde empezó.</p>
  <p data-edit="p4-2">Y si a los 7 pasos todo está como al principio, a los 14 también, y a los 21 también. Todo se repite cada 7 pasos.</p>
  <p data-edit="p4-3">Entonces, para saber qué pasa en un paso lejano, no hace falta recorrerlo. Alcanza con dividir ese número por 7 y mirar cuánto sobra. Si sobra 1, la fila está igual que en el paso 1.</p>
  <figure>
    <div class="ctrl">
      <label for="g1-far">Probalo con cualquier paso:</label>
      <input type="text" id="g1-far" inputmode="numeric" value="1000000000000000000" aria-describedby="g1-out">
      <button type="button" id="g1-jump">Calcular</button>
    </div>
    <div class="out" id="g1-out" aria-live="polite"></div>
    <div class="rows" id="g1-far-row"></div>
  </figure>
  <p data-edit="p4-4">Eso que acabamos de encontrar, «todo se repite cada 7 pasos», es lo que llamamos <b>patrón emergente</b> o <b>regla de resultado</b>. Es algo cierto sobre el futuro lejano que la regla de generación no dice, pero que sale de ella.</p>
</section>

<section id="build">
  <div class="sechead"><h2 data-edit="p5-h">5. De dónde salió ese patrón</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p5-1">Fijate bien en lo que pasó recién, porque es la clave de todo.</p>
  <p data-edit="p5-2"><b>Nadie eligió el patrón.</b> Escribimos una regla. Después pensamos qué hace esa regla a la larga. Y el patrón apareció solo, como consecuencia.</p>
  <p data-edit="p5-3">O sea que el patrón emergente no se elige por separado. Viene pegado a la regla. Cada regla trae el suyo, si es que trae alguno.</p>
  <p data-edit="p5-4">Por eso la pregunta «ya elegí el patrón, ¿qué regla lo genera?» no es el camino que usamos. Vamos al revés: <b>de la regla al patrón</b>.</p>
  <figure class="orders" role="group" aria-label="El camino para armar un juego">
    <div class="order"><span class="who">El camino</span>
      <span class="chip first">una regla corta</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">pensar qué hace a la larga</span><span class="arrow" aria-hidden="true">→</span>
      <span class="chip">aparece un patrón (o no)</span></div>
    <figcaption data-edit="p5-cap">Se prueba con una regla y se mira si trae patrón. No al revés.</figcaption>
  </figure>
</section>

<section>
  <div class="sechead"><h2 data-edit="p6-h">6. El problema: casi ninguna regla trae patrón</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p6-1">Con la regla de copiar a la vecina fue fácil. Pero si uno escribe una regla corta cualquiera, lo normal es que no se pueda decir nada del futuro lejano. La única forma conocida de saber qué pasa es hacer todos los pasos.</p>
  <p data-edit="p6-2">Hay reglas igual de cortas que la nuestra, estudiadas durante décadas, para las que nadie encontró nunca un patrón. La más famosa se llama regla 30.</p>
  <p data-edit="p6-3">Entonces el trabajo de armar un juego no es inventar un patrón. Es <b>encontrar reglas que sí traigan uno</b>, y que podamos estar seguros de que es cierto.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="p7-h">7. De dónde sacamos reglas que sí traen patrón</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p7-1">De dos lugares.</p>
  <ol class="steps">
    <li><span class="t" data-edit="p7-ah">Reglas tan simples que el patrón lo razonamos nosotros</span>
      <span class="what" data-edit="p7-a">Es lo que hicimos arriba. La regla solo mueve las cosas de lugar, así que se puede seguir con la cabeza qué pasa. Ese es el juego 1.</span></li>
    <li><span class="t" data-edit="p7-bh">Reglas que los matemáticos ya estudiaron</span>
      <span class="what" data-edit="p7-b">Hay reglas para las que alguien ya encontró el patrón y lo demostró, y está escrito en libros. Tomamos la regla y el patrón de ahí. Ese es el juego 2, que está más abajo.</span></li>
  </ol>
  <p data-edit="p7-2"><b>¿Quién elige?</b> Nosotros: vos y yo. Nadie más interviene, y ninguna IA.</p>
  <p data-edit="p7-3"><b>¿Con qué criterio?</b> Una regla entra como juego si cumple cuatro cosas.</p>
  <ul>
    <li data-edit="p7-c1"><b>Trae un patrón demostrado.</b> Tiene que haber un razonamiento que diga por qué vale siempre. Verlo en algunos ejemplos no alcanza.</li>
    <li data-edit="p7-c2"><b>A pura fuerza no se llega.</b> La pregunta va tan lejos que hacer todos los pasos es imposible.</li>
    <li data-edit="p7-c3"><b>El patrón no salta a la vista.</b> Si se ve de entrada, el examen es demasiado fácil. El juego 1 no cumple esto a propósito: es el de calentamiento.</li>
    <li data-edit="p7-c4"><b>Pasa la verificación.</b> Es lo que sigue.</li>
  </ul>
</section>

<section>
  <div class="sechead"><h2 data-edit="p8-h">8. La verificación</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="p8-1">Aunque el patrón esté demostrado, nosotros podemos equivocarnos al escribirlo en el programa. Entonces lo controlamos así.</p>
  <p data-edit="p8-2">Hacemos los primeros 3.000 pasos de las dos maneras: uno por uno con la regla de generación, y de un salto con el patrón. En cada paso comparamos las dos filas, casilla por casilla. Si alguna vez difieren, el juego se tira.</p>
  <figure>
    <div class="ctrl">
      <button type="button" id="v1-ok">Verificar el juego 1</button>
      <button type="button" class="quiet" id="v1-bad">Probar con un patrón equivocado</button>
    </div>
    <div class="out" id="v1-out" aria-live="polite"></div>
    <div class="rows" id="v1-rows"></div>
    <figcaption data-edit="p8-cap">Con el primer botón, la página hace esa comparación ahora mismo. El segundo usa a propósito un patrón equivocado («todo se repite cada 8 pasos»), para ver cómo salta el error.</figcaption>
  </figure>
  <p data-edit="p8-3">Son dos seguros distintos. El razonamiento dice que el patrón vale en el paso un trillón. La comparación dice que lo escribimos bien.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="p9-h">9. La receta completa</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <ol class="steps">
    <li><span class="t" data-edit="p9-1h">Buscamos una regla corta que traiga patrón</span>
      <span class="what" data-edit="p9-1">Una que podamos razonar nosotros, o una que ya esté resuelta en los libros.</span></li>
    <li><span class="t" data-edit="p9-2h">Nos aseguramos de que el patrón esté demostrado</span>
      <span class="what" data-edit="p9-2">Tiene que haber un razonamiento, no solo ejemplos.</span></li>
    <li><span class="t" data-edit="p9-3h">Elegimos cómo empieza la fila y la pregunta lejana</span>
      <span class="what" data-edit="p9-3">Tan lejos que haciendo todos los pasos no se llegue.</span></li>
    <li><span class="t" data-edit="p9-4h">Calculamos la respuesta con el patrón</span>
      <span class="what" data-edit="p9-4">Esa es la respuesta contra la que corregimos.</span></li>
    <li><span class="t" data-edit="p9-5h">Verificamos con la computadora</span>
      <span class="what" data-edit="p9-5">Los primeros 3.000 pasos, de las dos maneras.</span></li>
  </ol>
  <p data-edit="p9-6">A la IA le damos solo la regla de generación, la fila del comienzo y la pregunta. El patrón no. Encontrarlo es el examen.</p>
  <ul>
    <li data-edit="p9-7">Un límite de esta receta: solo salen juegos cuyo patrón ya conocía alguien. Una IA puede saberlo de memoria. Por eso los juegos que siguen lo van a disfrazar.</li>
    <li data-edit="p9-8">También va a haber juegos con reglas que no traen ningún patrón conocido, y juegos trampa. Esos se arman distinto y los vemos cuando lleguen.</li>
  </ul>
  <p class="more"><a href="#build" id="to-build">Volver a «De dónde salió ese patrón» ↑</a></p>
</section>

<section>
  <div class="kicker">Segunda parte · los dos juegos armados</div>
  <div class="sechead"><h2 data-edit="b-h">Juego 1: la luz que da vueltas</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="b-1">Es el ejemplo de arriba, completo.</p>
  <ul>
    <li data-edit="b-2"><b>Regla de generación:</b> cada casilla copia a su vecina de la izquierda.</li>
    <li data-edit="b-3"><b>Comienzo:</b> 7 casillas en ronda, una prendida.</li>
    <li data-edit="b-4"><b>Pregunta:</b> cómo está cada casilla en el paso un trillón.</li>
    <li data-edit="b-5"><b>Patrón:</b> todo se repite cada 7 pasos.</li>
    <li data-edit="b-6"><b>De dónde salió:</b> lo razonamos nosotros.</li>
    <li data-edit="b-7"><b>Respuesta:</b> un trillón dividido 7 sobra 1, así que la fila está igual que en el paso 1: la luz está en la casilla 1.</li>
  </ul>
  <p data-edit="b-8">Es fácil a propósito. Sirve de control: si una IA falla acá, lo que está roto es nuestro programa, no la IA.</p>
  <details>
    <summary>Ver el texto exacto que recibe la IA</summary>
<pre>Sistema: una fila de 7 casillas en anillo (la última es vecina de la primera).
Las casillas se numeran desde 0. Cada una está prendida (1) o apagada (0).

Regla (se aplica a todas las casillas a la vez, una vez por paso):
  cada casilla pasa a valer lo que valía su vecina de la izquierda.

Paso 0:
  1000000

Preguntas. Para cada una, contestá con la probabilidad de que la casilla esté prendida:
  - casilla 0 en el paso 1000000000000000000
  - casilla 1 en el paso 1000000000000000000
  ... (y así hasta la casilla 6)</pre>
  </details>
</section>

<section>
  <div class="sechead"><h2 data-edit="c-h">Cómo se califica</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="c-1">La IA no contesta solo sí o no. Dice cuán segura está de que la casilla está prendida. Eso permite tratar distinto al que sabe, al que duda y al que inventa.</p>
  <figure>
    <div class="ctrl">
      <label for="score-p">Supongamos que la casilla está prendida. La IA dice estar segura en un:</label>
      <input type="range" id="score-p" min="0" max="100" step="1" value="100">
    </div>
    <div class="out" id="score-out" aria-live="polite"></div>
    <div class="scale" aria-hidden="true">
      <div class="track"></div>
      <div class="mark" id="score-mark"></div>
      <span class="tick" style="left:0%">−3</span><span class="tick" style="left:25%">−2</span><span class="tick" style="left:50%">−1</span><span class="tick" style="left:75%">0</span><span class="tick" style="left:100%">+1</span>
    </div>
  </figure>
  <p data-edit="c-2">Mové la barra y fijate en tres puntos. Con 100% y acertando, saca +1. Con 50%, que es decir «no sé», saca 0. Con 0%, o sea segura de lo contrario, saca −3. Equivocarse con seguridad cuesta mucho más que admitir que no se sabe.</p>
</section>

<section>
  <div class="sechead"><h2 data-edit="d-h">Juego 2: las vecinas distintas</h2><button type="button" class="quiet ask" hidden>Preguntar o sugerir</button></div>
  <p data-edit="d-1">Este sale del segundo lugar: una regla que los matemáticos ya estudiaron. Vamos por los mismos pasos de la receta.</p>

  <h3 data-edit="d-h1">La regla</h3>
  <p data-edit="d-2">Hay 101 casillas en ronda, 8 prendidas al empezar. La regla de generación: <b>una casilla queda prendida si sus dos vecinas eran distintas entre sí.</b> Si eran iguales, queda apagada.</p>
  <div class="cases" aria-label="Tres ejemplos de la regla">
    <span class="case"><span class="sq on"></span><span class="sq">?</span><span class="sq"></span> → <span class="sq on"></span> distintas: prendida</span>
    <span class="case"><span class="sq on"></span><span class="sq">?</span><span class="sq on"></span> → <span class="sq"></span> iguales: apagada</span>
    <span class="case"><span class="sq"></span><span class="sq">?</span><span class="sq"></span> → <span class="sq"></span> iguales: apagada</span>
  </div>
  <figure>
    <canvas id="g2-canvas" width="606" height="360" role="img" aria-label="Los primeros pasos del juego 2: un dibujo de triángulos desordenados, sin repetición a la vista"></canvas>
    <div class="ctrl">
      <button type="button" id="g2-step">Un paso</button>
      <button type="button" id="g2-run">40 pasos más</button>
      <button type="button" class="quiet" id="g2-reset">Volver a empezar</button>
      <span class="out" id="g2-count" aria-live="polite"></span>
    </div>
    <figcaption data-edit="d-cap">Cada fila es un paso. Arriba está el paso 0.</figcaption>
  </figure>
  <p data-edit="d-3">Acá el truco del juego 1 no sirve. El dibujo no se repite a la vista. Se repite, pero recién a los 375 billones de pasos: haciendo mil millones de pasos por segundo serían más de 4 días.</p>

  <h3 data-edit="d-h2">El patrón, que está en los libros</h3>
  <p data-edit="d-4">Para esta regla los matemáticos demostraron algo. Dar 2 pasos da lo mismo que aplicar la regla una sola vez, pero mirando a las casillas que están 2 lugares más lejos en vez de a las vecinas. Con 4 pasos, lo mismo mirando a 4 lugares. Con 8, a 8. Y así duplicando.</p>
  <p data-edit="d-5">No hace falta creerlo. Comprobalo:</p>
  <figure>
    <div class="ctrl" role="group" aria-label="Cantidad de pasos a comparar">
      <span>Comparar con</span>
      <button type="button" class="quiet pick" data-d="1">1</button>
      <button type="button" class="quiet pick" data-d="2">2</button>
      <button type="button" class="quiet pick" data-d="3">3</button>
      <button type="button" class="quiet pick" data-d="4">4</button>
      <button type="button" class="quiet pick" data-d="8">8</button>
      <button type="button" class="quiet pick" data-d="16">16</button>
      <span>pasos</span>
    </div>
    <div class="strip"><span id="g2-a-lbl"></span><canvas id="g2-a" width="606" height="18" role="img" aria-label="La fila después de dar los pasos de a uno"></canvas></div>
    <div class="strip"><span id="g2-b-lbl"></span><canvas id="g2-b" width="606" height="18" role="img" aria-label="La fila después de aplicar la regla una vez a esa distancia"></canvas></div>
    <div class="verdict" id="g2-verdict" aria-live="polite"></div>
  </figure>
  <p data-edit="d-6">Con 3 no funciona: solo vale para 1, 2, 4, 8, 16 y los que siguen duplicando. Pero alcanza, porque cualquier número se arma sumando de esos. Para llegar al paso un trillón hacen falta 24 saltos, en vez de un trillón de pasos.</p>

  <h3 data-edit="d-h4">Por qué vale siempre</h3>
  <p data-edit="d-9">Este es el razonamiento, y se puede tocar. Arriba hay cinco casillas seguidas del paso 0. Abajo de todo está la casilla del medio, dos pasos después.</p>
  <figure>
    <div class="rows pyr" id="pyr"></div>
    <div class="out" id="pyr-out" aria-live="polite"></div>
    <div class="out" id="pyr-all"></div>
    <figcaption data-edit="d-capp">Tocá las casillas de arriba para prenderlas o apagarlas, y mirá cuáles cambian la de abajo.</figcaption>
  </figure>
  <p data-edit="d-10">Solo las dos de las puntas cambian la casilla de abajo. Las otras tres no la cambian nunca. Y las puntas están justo a 2 lugares del medio.</p>
  <p data-edit="d-11">La del medio no cuenta porque, al cambiarla, cambian a la vez las dos casillas del paso 1 que la miran. Si las dos cambian juntas, siguen siendo iguales o distintas entre sí, igual que antes.</p>
  <p data-edit="d-12">Eso muestra que 2 pasos equivalen a aplicar la regla una vez a 2 lugares de distancia. Y repitiendo el mismo razonamiento se pasa de 2 a 4, de 4 a 8, y así sin límite.</p>

  <h3 data-edit="d-h3">La respuesta y la verificación</h3>
  <figure>
    <div class="ctrl">
      <label for="g2-far">Saltar al paso:</label>
      <input type="text" id="g2-far" inputmode="numeric" value="1000000000000000000" aria-describedby="g2-out">
      <button type="button" id="g2-jump">Saltar</button>
    </div>
    <div class="out" id="g2-out" aria-live="polite"></div>
    <div class="strip"><span>Así queda la fila en ese paso:</span><canvas id="g2-far-row" width="606" height="18" role="img" aria-label="La fila en el paso pedido"></canvas></div>
  </figure>
  <figure>
    <div class="ctrl"><button type="button" id="v2-ok">Verificar el juego 2</button></div>
    <div class="out" id="v2-out" aria-live="polite"></div>
    <div id="v2-strips" hidden>
      <div class="strip"><span id="v2-a-lbl"></span><canvas id="v2-a" width="606" height="18" role="img" aria-label="La fila calculada contando paso por paso"></canvas></div>
      <div class="strip"><span id="v2-b-lbl"></span><canvas id="v2-b" width="606" height="18" role="img" aria-label="La misma fila calculada con el patrón"></canvas></div>
    </div>
  </figure>
  <p data-edit="d-7">Eso es lo que una IA tendría que descubrir en este juego. Nadie se lo dice: tiene la regla de una línea, una computadora chica para probar, y la pregunta.</p>
  <details>
    <summary>Ver el texto exacto que recibe la IA</summary>
<pre>Sistema: una fila de 101 casillas en anillo (la última es vecina de la primera).
Las casillas se numeran desde 0. Cada una está prendida (1) o apagada (0).

  - casilla 0 en el paso 1000000000000000000
  - casilla 5 en el paso 1000000000000000000
  ... (y así con las casillas 13, 29, 50, 64, 88 y 100)</pre>
  </details>
</section>

<script id="code">
(function () {
  "use strict";

  /*LOGIC-START*/
  // Juego 1: cada casilla copia a su vecina de la izquierda.
  function g1Start() { return [1, 0, 0, 0, 0, 0, 0]; }
  function g1Step(row) {
    var n = row.length, out = new Array(n);
    for (var i = 0; i < n; i++) out[i] = row[(i - 1 + n) % n];
    return out;
  }
  // Regla de resultado del juego 1: solo importa el resto de dividir por el largo.
  function g1Jump(row, steps) {
    var n = row.length, k = Number(steps % BigInt(n)), out = new Array(n);
    for (var i = 0; i < n; i++) out[i] = row[(((i - k) % n) + n) % n];
    return out;
  }
  // Juego 2: una casilla queda prendida si sus dos vecinas eran distintas.
  var G2_N = 101, G2_LIT = [3, 4, 17, 40, 41, 42, 77, 90], G2_CELLS = [0, 5, 13, 29, 50, 64, 88, 100];
  function g2Start() {
    var s = new Array(G2_N).fill(0);
    G2_LIT.forEach(function (i) { s[i] = 1; });
    return s;
  }
  // La misma regla, pero mirando a las casillas que están a distancia d.
  function g2FarStep(row, d) {
    var n = row.length, out = new Array(n);
    d = ((d % n) + n) % n;
    for (var i = 0; i < n; i++) out[i] = row[(i - d + n) % n] ^ row[(i + d) % n];
    return out;
  }
  function g2Step(row) { return g2FarStep(row, 1); }
  // Regla de resultado del juego 2: el paso se arma con saltos de 1, 2, 4, 8...
  function g2Jump(row, steps) {
    var n = row.length, d = 1, k = 0, jumps = [];

      steps >>= 1n; d = (d * 2) % n; k++;
    }
    return { row: row, jumps: jumps };
  }
  function score(p, truth) { return 1 - 4 * (p - truth) * (p - truth); }
  function sameRow(a, b) { for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  // Devuelve cuántos pasos comparó y, si hubo una diferencia, en qué paso (diffAt; -1 si no hubo).
  function verify(start, stepFn, jumpFn, until) {
    var counted = start;

  function g1JumpWrong(row, steps) {

    for (var i = 0; i < n; i++) out[i] = row[(((i - k) % n) + n) % n];
    return out;
  }

  function pyramid(top) {
    var mid = [top[0] ^ top[2], top[1] ^ top[3], top[2] ^ top[4]];
    return { mid: mid, bottom: mid[0] ^ mid[2] };
  }
  // De las 32 combinaciones de esas cinco, en cuántas la de abajo queda prendida justo cuando las puntas son distintas.
  function pyramidHolds() {
    var ok = 0;
    for (var m = 0; m < 32; m++) {

  }
  /*LOGIC-END*/

  if (typeof document === "undefined") return;

  // ---------- la página se dibuja a partir de la plantilla y del estado ----------
  var app = document.getElementById("app");
  app.appendChild(document.getElementById("tpl").content.cloneNode(true));
  function $(id) { return document.getElementById(id); }
  function token(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  var state = { edits: {} };

  var ALLOWED = { B: 1, STRONG: 1, EM: 1, I: 1, CODE: 1, BR: 1 };

  // ---------- dibujo de filas ----------

  // ---------- juego 1 ----------
  var g1 = { rows: [], t: 0 };

  $("g1-reset").addEventListener("click", function () { g1Reset(0); });
  function g1DoJump() {

  }
  $("g1-jump").addEventListener("click", g1DoJump);
  $("g1-far").addEventListener("keydown", function (e) { if (e.key === "Enter") g1DoJump(); });

  // ---------- puntaje ----------

  }
  $("score-p").addEventListener("input", scoreRender);

  // ---------- juego 2 ----------
  var G2_ROWS = 60, g2 = { rows: [], t: 0 };
  function g2Draw() {
    var c = $("g2-canvas"), g = c.getContext("2d"), w = c.width / G2_N, h = c.height / G2_ROWS;
    g.clearRect(0, 0, c.width, c.height);

  }
  function g2Advance(nSteps) {

  $("g2-run").addEventListener("click", function () { g2Advance(40); g2Draw(); });
  $("g2-reset").addEventListener("click", function () { g2Reset(0); });

  var g2d = 2;
  var picks = Array.prototype.slice.call(app.querySelectorAll("button.pick"));
  function g2Compare() {
    var a = g2Start();

    $("g2-a-lbl").textContent = "Dando " + g2d + (g2d === 1 ? " paso" : " pasos") + " de a uno:";
    $("g2-b-lbl").textContent = "Aplicando la regla una sola vez, mirando a distancia " + g2d + ":";

    var on = G2_CELLS.filter(function (c) { return res.row[c] === 1; });
    var off = G2_CELLS.filter(function (c) { return res.row[c] !== 1; });
    $("g2-out").innerHTML = "Paso <b>" + withDots(t) + "</b>: hicieron falta <b>" + res.jumps.length + "</b> saltos y " +
      (ms < 1 ? "menos de 1 milisegundo" : Math.round(ms) + " milisegundos") + ". De las casillas preguntadas, prendidas: <b>" +
      (on.length ? on.join(", ") : "ninguna") + "</b>. Apagadas: <b>" + (off.length ? off.join(", ") : "ninguna") + "</b>.";
    drawStrip($("g2-far-row"), res.row);
  }

  $("g2-far").addEventListener("keydown", function (e) { if (e.key === "Enter") g2DoJump(); });

  // ---------- verificación a la vista: la cuenta paso por paso contra la regla de resultado ----------
  var V_UNTIL = 3000;
  function took(ms) { return ms < 1 ? "menos de 1 milisegundo" : Math.round(ms) + " milisegundos"; }
  function v1Run(wrong) {
    var res = verify(g1Start(), g1Step, wrong ? g1JumpWrong : g1Jump, V_UNTIL);
    if (res.diffAt < 0) {
      $("v1-out").innerHTML = "Comparamos <b>" + withDots(res.compared) + "</b> pasos (del 0 al " + withDots(V_UNTIL) +
        "), las 7 casillas de cada uno: <b>ninguna diferencia</b>. Abajo, el paso " + withDots(res.shown) + " calculado de las dos maneras.";
    } else {
      $("v1-out").innerHTML = (wrong ? "Con el patrón equivocado «todo se repite cada 8 pasos», la" : "La") +
        " cuenta y la regla <b>difieren en el paso " + withDots(res.diffAt) + "</b>. Contando, la luz está en la casilla <b>" +
        res.counted.indexOf(1) + "</b>. El patrón dice casilla <b>" + res.ruled.indexOf(1) + "</b>. Un juego así se tira.";
    }
    $("v1-rows").innerHTML = rowHtml("contando", res.counted, "") + rowHtml("el patrón", res.ruled, res.diffAt < 0 ? "" : "diff");
  }
  $("v1-ok").addEventListener("click", function () { v1Run(false); });
  $("v1-bad").addEventListener("click", function () { v1Run(true); });

  var v2Last = null;
  function v2Draw() { drawStrip($("v2-a"), v2Last.counted); drawStrip($("v2-b"), v2Last.ruled); }
  function v2Run() {
    var t0 = performance.now();
    var res = verify(g2Start(), g2Step, function (s, t) { return g2Jump(s, t).row; }, V_UNTIL);
    var ms = performance.now() - t0;
    v2Last = res;
    $("v2-out").innerHTML = res.diffAt < 0
      ? "Comparamos <b>" + withDots(res.compared) + "</b> pasos (del 0 al " + withDots(V_UNTIL) +
        "), las 101 casillas de cada uno: <b>ninguna diferencia</b>. Tardó " + took(ms) + "."
      : "La cuenta y la regla <b>difieren en el paso " + withDots(res.diffAt) + "</b>. Un juego así se tira.";
    $("v2-a-lbl").textContent = "El paso " + withDots(res.shown) + ", contando de a un paso:";
    $("v2-b-lbl").textContent = "El paso " + withDots(res.shown) + ", de un salto con el patrón:";
    $("v2-strips").hidden = false;
    v2Draw();
  }
  $("v2-ok").addEventListener("click", v2Run);

  // ---------- por qué vale la regla del juego 2: cinco casillas, dos pasos ----------
  var PYR_NAMES = ["La casilla de la punta izquierda", "La casilla pegada al medio, a la izquierda", "La casilla del medio",
    "La casilla pegada al medio, a la derecha", "La casilla de la punta derecha"];
  var pyr = { top: [1, 0, 1, 1, 0], cells: [], mid: [], bottom: null };
  function pyrBuild() {
    var box = $("pyr");
    function row(label) {
      var r = document.createElement("div"), l = document.createElement("span");
      r.className = "row"; l.className = "lbl"; l.textContent = label;
      r.appendChild(l); box.appendChild(r);
      return r;
    }
    function cell(parent, tag, cls) { var e = document.createElement(tag); e.className = cls; parent.appendChild(e); return e; }
    function gap(parent) { cell(parent, "span", "sq gap").setAttribute("aria-hidden", "true"); }
    var r0 = row("paso 0"), r1 = row("paso 1"), r2 = row("paso 2");
    [0, 1, 2, 3, 4].forEach(function (i) {
      var b = cell(r0, "button", "sq");
      b.type = "button";
      b.addEventListener("click", function () { pyr.top[i] ^= 1; pyrRender(); });
      pyr.cells.push(b);
    });
    gap(r1); for (var j = 0; j < 3; j++) pyr.mid.push(cell(r1, "span", "sq")); gap(r1);
    gap(r2); gap(r2); pyr.bottom = cell(r2, "span", "sq"); gap(r2); gap(r2);
  }
  function pyrRender() {
    var res = pyramid(pyr.top), differ = pyr.top[0] !== pyr.top[4];
    pyr.cells.forEach(function (b, i) {
      b.className = "sq" + (pyr.top[i] ? " on" : "");
      b.setAttribute("aria-pressed", String(!!pyr.top[i]));
      b.setAttribute("aria-label", PYR_NAMES[i] + ": " + (pyr.top[i] ? "prendida" : "apagada"));
    });
    pyr.mid.forEach(function (e, j) { e.className = "sq" + (res.mid[j] ? " on" : ""); });
    pyr.bottom.className = "sq" + (res.bottom ? " on" : "");
    $("pyr-out").innerHTML = "Las dos de las puntas son <b>" + (differ ? "distintas" : "iguales") +
      "</b>: la de abajo queda <b>" + (res.bottom ? "prendida" : "apagada") + "</b>.";
  }

  // ---------- el enlace del principio lleva a la sección de armado ----------
  $("to-build").addEventListener("click", function (e) {
    var target = $("build");
    if (!target || !target.scrollIntoView) return;
    e.preventDefault();
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  });

  function redrawCanvases() { g2Draw(); g2Compare(); g2DoJump(); if (v2Last) v2Draw(); }
  g1Reset(2); g1DoJump(); scoreRender(); g2Reset(G2_ROWS - 1); g2Compare(); g2DoJump();
  $("v1-out").textContent = "Todavía no se hizo. Apretá un botón.";
  $("v2-out").textContent = "Todavía no se hizo. Apretá el botón.";
  pyrBuild(); pyrRender();
  $("pyr-all").innerHTML = "La página probó las 32 maneras posibles de prender y apagar esas cinco casillas. En <b>" +
    pyramidHolds() + "</b> de las 32, la de abajo queda prendida cuando las dos puntas son distintas, y apagada cuando son iguales.";
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", redrawCanvases);
  }
  new MutationObserver(redrawCanvases).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- editar el texto y guardarlo como versión nueva de la página ----------
  var SKELETON = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  var HEAD = '<title>Los dos primeros juegos</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">\n';
  function buildDocument(next) {
    var close = function (tag) { return "<" + "/" + tag + ">"; };
    var json = JSON.stringify(next).replace(/</g, "\\u003c");
    return SKELETON + "\n" + HEAD +
      '<style id="css">' + $("css").textContent + close("style") + "\n" +
      '<script type="application/json" id="state">' + json + close("script") + "\n" +
      '<template id="tpl">' + $("tpl").innerHTML + close("template") + "\n" +
      '<div id="app">' + close("div") + "\n" +
      '<script id="code">' + $("code").textContent + close("script") + "\n" +
      "\n</body></html>";
  }

  var editing = false, artifactApi = null;
  function note(msg) { $("edit-note").textContent = msg; }
  function setEditing(on) {
    editing = on;
    editable.forEach(function (el) { if (on) el.setAttribute("contenteditable", "true"); else el.removeAttribute("contenteditable"); });
    $("edit-start").hidden = on; $("edit-save").hidden = !on; $("edit-cancel").hidden = !on;
    note(on ? "Tocá cualquier texto resaltado y escribí." : "");
  }
  function readOnly() { setEditing(false); applyEdits(); $("editbar").hidden = true; }
  app.addEventListener("keydown", function (e) {
    if (editing && e.key === "Enter" && e.target.closest && e.target.closest("[data-edit]")) e.preventDefault();
  });
  app.addEventListener("paste", function (e) {
    if (!editing || !(e.target.closest && e.target.closest("[data-edit]"))) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    sel.deleteFromDocument();
    sel.getRangeAt(0).insertNode(document.createTextNode(text));
    sel.collapseToEnd();
  });
  $("edit-start").addEventListener("click", function () { setEditing(true); });
  $("edit-cancel").addEventListener("click", function () { setEditing(false); applyEdits(); });
  $("edit-save").addEventListener("click", function () {
    if (!artifactApi) return;
    var edits = {};
    editable.forEach(function (el) {
      var k = el.getAttribute("data-edit"), cur = sanitize(el.innerHTML);
      if (cur !== defaults[k]) edits[k] = cur;
    });
    note("Guardando…");
    $("edit-save").disabled = true;
    artifactApi.publish(buildDocument({ edits: edits })).then(function () {
      note("Guardado. La página se va a recargar.");
    }, function (err) {
      var code = err && err.code;
      $("edit-save").disabled = false;
      if (code === "conflict") { note("Se guardó otra versión antes. La página se va a recargar."); return; }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" ||
          code === "capability_disabled" || code === "capability_removed") { readOnly(); return; }
      note("No se pudo guardar (" + (code || "error") + "). Tu texto sigue acá: probá de nuevo en un rato.");
    });
  });

  // ---------- las capacidades llegan después; la página funciona sin ellas ----------
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (api) {
      if (!api) return;
      artifactApi = api;
      $("editbar").hidden = false;
    }, function () {});
    window.claude.use("comments").then(function (api) {
      if (!api) return;
      Array.prototype.slice.call(app.querySelectorAll("button.ask")).forEach(function (btn) {
        btn.hidden = false;
        btn.addEventListener("click", function () {
          var section = btn.closest("section");
          api.openComposer({ element: section.querySelector("h2") || section }).then(function () {}, function (err) {
            if (err && err.code === "unavailable") btn.hidden = true;
          });
        });
      });
    }, function () {});
  }
})();
</script>
